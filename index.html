<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DV1KLMY93N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());

      gtag('config', 'G-DV1KLMY93N');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Visible Human Project's male and female bodies and its head, in 3D in the browser: turn them, cut them open, and see them as splats, an X-ray, traced surfaces or meshes." />
    <!-- No icon of its own: an empty one keeps the browser from asking the server for a favicon that isn't there -->
    <link rel="icon" href="data:," />
    <title>VisibleHuman</title>
    <script>
      // Starts the downloads of the list of bodies and of the default file of the body the address names, or of the
      // first body where ?body= names none, as the page does, while the page's script is still loading. Each is
      // preloaded as the CORS fetch the page makes, so the page's own fetch takes the preloaded response instead of
      // asking again. The table lists each body's default file in bodies.json's order, which a test holds it to
      (function () {
        var files = { "male": "volume/male-4mm.bin", "female": "volume/female-4mm.bin", "head": "volume/head-1.2mm.bin" };
        var body = new URLSearchParams(window.location.search).get('body');
        var file = Object.prototype.hasOwnProperty.call(files, body) ? files[body] : files[Object.keys(files)[0]];
        ['volume/bodies.json', file].forEach(function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
